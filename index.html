<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AldeaConecta - Los Guaritos</title>
    <!-- Aquí enlazamos tus estilos -->
    <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
    <!-- Encabezado Institucional -->
    <header class="main-header">
        <div class="header-content">
            <h1>AldeaConecta</h1>
            <p>Guía y Directorio de la Aldea Universitaria Los Guaritos</p>
        </div>
    </header>

    <!-- Contenido Principal -->
    <main class="main-container">
        
        <!-- Sección Guía -->
        <section id="seccion-guia" class="content-section">
            <h2 class="section-title">Guía Práctica</h2>
            <div id="contenedor-guia" class="content-box">
                <p class="loading-text">Cargando guía...</p>
            </div>
        </section>

        <!-- Sección Directorio -->
        <section id="seccion-directorio" class="content-section">
            <h2 class="section-title">Directorio de Saberes</h2>
            <div id="contenedor-directorio" class="content-box">
                <p class="loading-text">Cargando directorio...</p>
            </div>
        </section>

    </main>

    <!-- Pie de página -->
    <footer class="main-footer">
        <p>Proyecto Socio-Tecnológico - UTD Francisco Tamayo &copy; 2026</p>
    </footer>

    <script type="module" src="./js/main.js"></script>
</body>
</html>
